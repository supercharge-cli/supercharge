[package]
name = "supercharge-superagent"
version = "1.3.6"
edition.workspace = true
license.workspace = true
description = "Rust daemon extensions for a self-hostable agent runtime"

[features]
default = []
e2b = ["dep:e2b-rs"]

[dependencies]
anyhow = { workspace = true }
async-stream = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
e2b-rs = { path = "../../../third_party/e2b-rs", optional = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
rustls = { workspace = true }
rustls-native-certs = "0.8"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tower-http = { workspace = true, features = ["limit"] }
urlencoding = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "signal", "sync", "time"] }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = { workspace = true }

[[bin]]
name = "supercharge-superagent-server"
path = "src/bin/server.rs"

[lints]
workspace = true
