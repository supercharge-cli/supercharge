[package]
license = "Apache-2.0"
name = "supercharge-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the grok CLI, extracted from supercharge-shell for dependency inversion."

[dependencies]
agent-client-protocol = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
supercharge-announcements = { workspace = true }
supercharge-config = { workspace = true }
supercharge-mcp = { workspace = true }
supercharge-sandbox = { path = "../supercharge-sandbox", default-features = false }

[features]
default-bazel = []

[lints]
workspace = true
