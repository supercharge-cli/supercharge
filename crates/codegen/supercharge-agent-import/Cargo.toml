[package]
license = "Apache-2.0"
name = "supercharge-agent-import"
version = "0.1.0"
edition.workspace = true
description = "Import settings from other coding agents into Supercharge config: permissions, hooks, MCP servers, environment variables, skill directories, and rule directories"

[dependencies]
dunce = { workspace = true }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
supercharge-config-types = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
