[package]
name = "supercharge-desktop"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "First-party Supercharge desktop ACP client. Spawns `agent stdio`; does not reimplement the harness."
authors = ["iotserver24"]

[[bin]]
name = "supercharge-desktop"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
eframe = "0.31"
egui = "0.31"
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "macros",
    "process",
    "io-util",
    "sync",
    "rt-multi-thread",
] }
tokio-util = { workspace = true, features = ["compat"] }
supercharge-tty-utils = { workspace = true }

[lints]
workspace = true
