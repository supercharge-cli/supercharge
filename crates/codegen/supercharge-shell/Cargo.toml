[package]
license = "Apache-2.0"
name = "supercharge-shell"
version = "1.0.5"
edition.workspace = true

[features]
default = []
dhat-heap = ["dep:dhat"]
# Session synthesis + in-process e2e harness (`session::testkit`) for soak,
# load, and bench tests. Off by default; the tests/benches that use it declare
# it via `required-features`.
test-support = []
test-util = []
# Local Computer Hub workspace_server (own/attach + crash-restart). Requires
local-workspace = []
default-bazel = [
    "local-workspace",
    "test-support",
]

[dependencies]
dunce = { workspace = true }
tonic-prost = { workspace = true, optional = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
supercharge-announcements = { workspace = true }
supercharge-prompt-queue = { workspace = true }
supercharge-version = { workspace = true }

async-openai = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bm25 = "2.3"
bytes = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
ignore = { workspace = true }
jsonschema = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
kanal = "0.1"
regex = { workspace = true }
# rmcp 2.1 + reqwest 0.13 are quarantined inside `supercharge-mcp`. The remaining
# MCP code in this crate (extensions/mcp.rs, mcp_doctor.rs) reaches rmcp model
# types via `supercharge_mcp::rmcp::model::*`. reqwest 0.13 is a private impl
# detail of supercharge-mcp::servers; shell never sees it. Every HTTP call site
# in this crate uses workspace reqwest 0.12.
supercharge-mcp = { workspace = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
reqwest-middleware = { workspace = true }
serde = { workspace = true }
serde_ignored = "0.1"
serde_json = { workspace = true, features = ["preserve_order"] }
similar = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
dirs = "6"
tokio-stream = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
toml = { workspace = true, features = ["preserve_order"] }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "process",
    "rt",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
obfstr = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
tokio-retry = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
supercharge-acp-lib = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
backon = { workspace = true }
webbrowser = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rustls-native-certs = "0.8"
futures-util = { workspace = true }
urlencoding = { workspace = true }
gethostname = { workspace = true }
gcloud-storage = { workspace = true }
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
nucleo = { workspace = true }
arc-swap = { workspace = true }
infer = "0.15"
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
moka = { workspace = true, features = ["future"] }
dhat = { workspace = true, optional = true }
base64 = { workspace = true }
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
sha2 = { workspace = true }
rand = { workspace = true }
shlex = { workspace = true }
strum = { workspace = true }
supercharge-fast-worktree = { path = "../supercharge-fast-worktree", features = ["metadata"] }

tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
supercharge-paths = { path = "../supercharge-paths" }
supercharge-shell-base = { workspace = true }
supercharge-shell-session-support = { workspace = true }
supercharge-shared = { workspace = true }
supercharge-tracing-macros = { path = "../supercharge-tracing-macros" }
supercharge-fsnotify = { path = "../supercharge-fsnotify" }
supercharge-codebase-graph = { path = "../supercharge-codebase-graph" }
supercharge-hunk-tracker = { path = "../supercharge-hunk-tracker" }
supercharge-agent-lifecycle = { workspace = true }
supercharge-interjection-core = { workspace = true }
supercharge-sandbox = { path = "../supercharge-sandbox", default-features = false }
supercharge-chat-state = { path = "../supercharge-chat-state" }
# Segment markdown rendering + the `compaction/` store path convention.
supercharge-compaction-transcript = { workspace = true }
supercharge-compaction = { path = "../../common/supercharge-compaction" }
supercharge-extra-ca = { workspace = true }
supercharge-sampler = { path = "../supercharge-sampler" }
# Session FTS search; owns this crate's only rusqlite/bundled-SQLite use.
supercharge-session-search = { workspace = true }
supercharge-token-estimation = { workspace = true }
supercharge-sampling-types = { path = "../supercharge-sampling-types" }
supercharge-tools = { path = "../supercharge-tools" }
supercharge-tty-utils = { workspace = true }
supercharge-workflow = { path = "../supercharge-workflow" }
supercharge-system-power = { workspace = true }
supercharge-workspace = { workspace = true }
# Backs the compatibility-only `supercharge_shell::foreign_sessions` re-export.
supercharge-foreign-sessions = { workspace = true }
supercharge-subagent-resolution = { path = "../supercharge-subagent-resolution" }
supercharge-superagent = { path = "../supercharge-superagent" }
supercharge-agent = { path = "../supercharge-agent" }
supercharge-bundle = { workspace = true }
supercharge-config = { workspace = true }
supercharge-config-types = { workspace = true }
supercharge-memory = { workspace = true }
supercharge-hooks = { path = "../supercharge-hooks" }
supercharge-hooks-plugins-types = { path = "../supercharge-hooks-plugins-types" }
supercharge-plugin-marketplace = { path = "../supercharge-plugin-marketplace" }
supercharge-file-utils = { path = "../supercharge-file-utils" }
supercharge-session-events = { workspace = true }
supercharge-auth = { workspace = true, features = ["middleware"] }
supercharge-telemetry = { workspace = true }
supercharge-http = { workspace = true }
supercharge-models = { workspace = true }
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
flate2 = { workspace = true }
fs2 = { workspace = true }
zstd = { workspace = true }
tar = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
tdigests = "1.0"
semver = { workspace = true }
process-wrap = { version = "9.0.0", features = ["tokio1", "job-object", "creation-flags"] }
portable-pty = "0.9"
parking_lot.workspace = true
dashmap.workspace = true

# Used by acp_session.rs and mcp_servers.rs for the unified
# supercharge_tool_runtime::Tool dispatch model and the computer-hub MCP adapter.
supercharge-computer-hub-sdk = { workspace = true }
supercharge-tool-runtime = { workspace = true }
supercharge-tool-protocol = { workspace = true }
supercharge-tool-types = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
siphasher = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Pre-main unified-log redirect (`test_support::redirect_unified_log_for_tests`).
ctor = { workspace = true }
filetime = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
# `extensions::bundle` tests build archives with `bundle::test_helpers`, which
# is `#[cfg(test)]`-only inside supercharge-bundle without this feature.
supercharge-bundle = { workspace = true, features = ["test-support"] }
supercharge-memory = { workspace = true, features = ["test-support"] }
supercharge-workspace = { workspace = true, features = ["test-support"] }
supercharge-config = { workspace = true, features = [] }
ring = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
rsa = { workspace = true }
semver = { workspace = true }
serial_test = { workspace = true }
# Test-only builds expose `env::EnvVarGuard` and the cpu_profile test seams to
# this crate's test targets.
supercharge-shell-base = { workspace = true, features = ["test-support"] }
supercharge-test-support = { workspace = true, features = [] }
supercharge-test-utils = { workspace = true }
# `test-util` enables `#[tokio::test(start_paused = true)]` (paused virtual
# clock with auto-advance) so interval-driven loop tests in `auth::refresh`
# can assert exact tick counts deterministically without real-time sleep.
tokio = { workspace = true, features = ["test-util"] }

[dependencies.tempfile]
workspace = true

[[bench]]
name = "session_list"
harness = false

[[bench]]
name = "fork_copy"
harness = false
required-features = ["test-support"]

[[bench]]
name = "skills_watcher_startup"
harness = false

[[bench]]
name = "child_replay_lookup"
harness = false

[[test]]
name = "test_leader_soak"
required-features = ["test-support"]

[[test]]
name = "test_session_load_memory"
required-features = ["test-support"]

[[test]]
name = "test_fork_copy_memory"
required-features = ["test-support"]

[[test]]
name = "session_fork_replay_memory"
required-features = ["test-support"]

[[test]]
name = "session_load_perf"
required-features = ["test-support"]

[[test]]
name = "testkit_synth_roundtrip"
required-features = ["test-support"]

[lints]
workspace = true
[build-dependencies]
# build.rs only downloads ripgrep — no rmcp involvement. Workspace reqwest
# (0.12) is plenty.
reqwest = { workspace = true, features = ["blocking"] }
flate2 = { workspace = true }
tar = { workspace = true }
[[bin]]
name = "chat-history-downgrade"
path = "src/bin/chat-history-downgrade.rs"
