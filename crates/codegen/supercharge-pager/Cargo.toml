[package]
name = "supercharge-pager"
version = "1.3.51"
edition.workspace = true
license = "Apache-2.0"
authors = ["iotserver24"]

[dependencies]
# TTY safety — detach subprocesses from the controlling terminal
dunce = { workspace = true }
supercharge-tty-utils = { workspace = true }
supercharge-version = { workspace = true }

# Shared prompt-queue wire types
supercharge-prompt-queue = { workspace = true }

# Presentation-primitives layer (extracted)
supercharge-pager-render = { path = "../supercharge-pager-render" }

# The /gboom easter-egg game (extracted)
supercharge-gboom = { path = "../supercharge-gboom" }

# Diff hunk construction (extracted)
supercharge-pager-diff = { path = "../supercharge-pager-diff" }

# Rendering
ratatui = { workspace = true, features = ["crossterm", "unstable-widget-ref"] }
supercharge-announcements = { workspace = true }
crossterm = { workspace = true, features = ["event-stream", "bracketed-paste"] }
textwrap = { workspace = true }
regex = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
strip-ansi-escapes = { workspace = true }

# Markdown / syntax highlighting
supercharge-markdown = { workspace = true }
# Inline Mermaid rendering engine. Always compiled (no feature gate): the
# dagre-based vendored engine renders detected ```mermaid fences out of process,
# gated only at runtime by the `appearance.render_mermaid` setting.
supercharge-mermaid = { workspace = true }
syntect = { workspace = true }

# Data
similar = { workspace = true }
indexmap = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true, features = ["serde"] }

# ANSI parsing (tracing pane)
ansi-to-tui = { workspace = true }

# PTY for ssh wrapper, e2e tests, and benchmarking.
portable-pty = "0.9"

# Utilities
anyhow = { workspace = true }
shlex = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
] }
tokio-stream = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["compat"] }
tempfile = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Binary hardening: compile-time string obfuscation.
# (cryptify / rustls / semver / tikv-jemallocator moved to the composition-root
# binary `supercharge-pager-bin` with `main.rs`; this lib no longer references them.)
obfstr = { workspace = true }

# Fuzzy matching (history search daemon)
nucleo = { workspace = true }

# Prompt text input
supercharge-ratatui-textarea = { workspace = true }
supercharge-ratatui-inline = { workspace = true }

# Update
supercharge-update = { path = "../supercharge-update" }

# ACP
agent-client-protocol = { workspace = true }
supercharge-acp-lib = { workspace = true }
supercharge-chat-state = { path = "../supercharge-chat-state", optional = true }
supercharge-file-utils = { path = "../supercharge-file-utils" }
# Crash-recovery registry of open TUI sessions.
supercharge-active-sessions = { workspace = true }
supercharge-config = { workspace = true }
supercharge-feedback = { workspace = true }
supercharge-sampling-types = { path = "../supercharge-sampling-types", optional = true }
supercharge-tool-types = { workspace = true, optional = true }
supercharge-dirs = { workspace = true }
supercharge-dashboard-store = { workspace = true }
# Voice dictation. `audio` (mic capture) is enabled on every target. On
# macOS/Windows it links cpal; on Linux it compiles a subprocess-recorder
# backend instead, so cpal -> alsa-sys never reaches the static musl binary
# (cpal is target-gated to non-Linux inside supercharge-voice).
supercharge-voice = { path = "../supercharge-voice", default-features = false, features = ["audio"] }
supercharge-login = { workspace = true }
supercharge-models = { workspace = true }
supercharge-shell = { workspace = true }
# The status-line contract: the config the user writes and the payload the
# agent sends. A leaf crate rather than the agent's, so the client reads it
# from upstream of the crate that fills it in.
supercharge-status-line = { workspace = true }
supercharge-workspace = { workspace = true }
# Foreign coding-agent session discovery.
supercharge-foreign-sessions = { workspace = true }
supercharge-token-estimation = { workspace = true }
supercharge-telemetry = { workspace = true }
supercharge-otel = { workspace = true }
supercharge-fast-worktree = { path = "../supercharge-fast-worktree", features = ["metadata"] }
gethostname = { workspace = true, optional = true }
backon = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
supercharge-tools = { workspace = true }
supercharge-agent = { workspace = true }
supercharge-plugin-marketplace = { path = "../supercharge-plugin-marketplace" }
# Blocked-card copy: `hook_display_name` lives next to the hook-name grammar.
supercharge-hooks = { path = "../supercharge-hooks" }
supercharge-hooks-plugins-types = { path = "../supercharge-hooks-plugins-types" }
walkdir = { workspace = true }
supercharge-sandbox = { path = "../supercharge-sandbox", default-features = false }

# Base64 encoding for image data
base64 = { workspace = true }

# Image decoding/resizing for clipboard image validation before send
image = { workspace = true, features = ["png", "jpeg", "tiff", "gif", "webp"] }

# ID generation
uuid = { workspace = true, features = ["v4"] }

# Path computation (plan file, etc.)
shellexpand = "3.1"

# libgit2 for the startup git-info populator (no fork/exec, runs once on launch
# in spawn_blocking; the render path never touches git directly).
git2 = { version = "0.20", default-features = false, features = [
    "vendored-libgit2",
] }
urlencoding = { workspace = true }

# Parsing (web_search)
url = { workspace = true }

# Crash diagnostics
supercharge-crash-handler = { path = "../supercharge-crash-handler" }

# Non-poisoning mutex for signal handler (active-sessions crash recovery).
parking_lot.workspace = true

# nix: signal handling in notifications/.
# signal-hook: SIGWINCH handler for the `grok wrap` PTY wrapper (pty_wrap.rs).
# libc: poll/read for non-blocking terminal reads in theme/osc11.rs.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }
signal-hook = { workspace = true }
libc = { workspace = true }

# core-foundation: IOKit power assertions for sleep prevention (SleepInhibitor).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }

# SetConsoleCtrlHandler for the exec-emulating screen-mode relaunch
# (`/minimal` / `/fullscreen`): the waiting parent must ignore console Ctrl
# events so only the relaunched child handles them. Version matches the other
# in-repo consumers (supercharge-crash-handler, supercharge-system-power).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The fixture that builds a `[ui.status_line]` section field by field.
supercharge-status-line = { workspace = true, features = ["test-support"] }
supercharge-pager-render = { path = "../supercharge-pager-render", features = ["test-support"] }
supercharge-ratatui-inline = { workspace = true, features = ["test-support"] }
supercharge-gboom = { path = "../supercharge-gboom", features = ["test-support"] }
supercharge-login = { workspace = true, features = ["test-support"] }
supercharge-shell = { workspace = true, features = ["test-support"] }
pretty_assertions = { workspace = true }
insta = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }
supercharge-agent = { workspace = true }
# In-process leader-cluster harness (mock inference server; no cycle:
# supercharge-test-support depends on neither the pager nor the shell).
supercharge-test-support = { workspace = true, features = [] }
# Provider install for the in-process leader-cluster tests.
supercharge-extra-ca = { workspace = true }

[[bench]]
name = "render"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "edit_highlight"
harness = false

[[bench]]
name = "resize"
harness = false

# Settings modal regression tests — keyboard/mouse dispatch + registry
# contracts. Not gated by `--ignored`; runs on every `cargo test`.
# Spawn-only pager tests live in `supercharge-pager-pty-harness`.
[[test]]
name = "settings_e2e"
path = "tests/settings_e2e.rs"

# Opt into [workspace.lints.clippy] (too_many_arguments etc.). Without this,
# `cargo clippy --workspace -- -D warnings` on this package is stricter than
# the workspace-default clippy allows used in CI.
[lints]
workspace = true

[features]
default = ["jemalloc", "sandbox-enforce"]
default-bazel = [
    "jemalloc",
    "sandbox-enforce",
    "test-support",
    "local-workspace",
    ]
local-workspace = ["supercharge-shell/local-workspace"]
# No-op on this crate: the actual `#[global_allocator]` (and the
# `tikv-jemallocator` dep) live on the composition-root binary
# `supercharge-pager-bin`, which owns `main.rs`. Kept as an empty feature so the
# workspace-uniform `[jemalloc, sandbox-enforce]` default set resolves
# here too and the generated `crate_features` stay valid.
jemalloc = []
sandbox-enforce = ["supercharge-sandbox/enforce"]
release-dist = []
# Exposes test-only view-model constructors/setters (e.g. `test_agent_view`,
# `AgentSession::set_yolo_mode_for_test`) to sibling crates' test builds — used
# by `supercharge-pager-minimal`'s unit tests. Never enabled in production builds.
test-support = ["supercharge-pager-render/test-support", "supercharge-gboom/test-support"]
