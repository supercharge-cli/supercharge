[package]
license = "Apache-2.0"
name = "supercharge-otel"
version = "0.1.0"
edition.workspace = true
description = "OpenTelemetry foundation for Supercharge AI: W3C trace-context propagation, the OTLP HTTP client, and the tracing->OTLP span layer/provider"
authors = ["xAI"]

[features]
default-bazel = []

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-http = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }
supercharge-auth = { workspace = true }
supercharge-extra-ca = { workspace = true }
supercharge-env = { workspace = true, optional = true }
supercharge-secrets = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
rcgen = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
