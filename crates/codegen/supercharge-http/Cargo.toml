[package]
license = "Apache-2.0"
name = "supercharge-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the grok CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
supercharge-auth = { workspace = true, features = ["middleware"] }
supercharge-extra-ca = { workspace = true }
supercharge-sampler = { path = "../supercharge-sampler" }
supercharge-telemetry = { workspace = true }
supercharge-version = { workspace = true }
supercharge-workspace = { workspace = true }

[lints]
workspace = true
