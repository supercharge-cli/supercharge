[package]
name = "xai-grok-superagent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rust daemon extensions for a self-hostable agent runtime"

[features]
default = []
e2b = ["dep:e2b-rs"]

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
e2b-rs = { path = "../../../third_party/e2b-rs", optional = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
urlencoding = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "process", "signal", "sync", "time"] }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = { workspace = true }

[[bin]]
name = "xai-grok-superagent-server"
path = "src/bin/server.rs"

[lints]
workspace = true
