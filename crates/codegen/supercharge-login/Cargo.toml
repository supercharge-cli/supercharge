[package]
license = "Apache-2.0"
name = "supercharge-login"
version = "0.1.0"
edition.workspace = true
description = "Authentication subsystem for the grok shell crate family: login flows, token refresh, credential providers, and auth storage."

[features]
# Loom model-checking for src/manager/lock/flock_wait.rs; test-only
# (compile_error!-guarded). Run in release (debug overflows loom's stacks):
#   cargo test --release --features loom -p supercharge-login --lib flock_wait::loom -- --test-threads=1
loom = ["dep:loom"]
# Exposes `#[cfg(test)]`-only helpers to downstream crates' test targets.
test-support = []
default-bazel = ["test-support"]

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
backon = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
fs2 = { workspace = true }
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "aws_lc_rs"] }
obfstr = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["stream", "blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "process",
    "rt",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
] }
tokio-util = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4", "v7"] }
webbrowser = { workspace = true }
supercharge-file-utils = { path = "../supercharge-file-utils" }
supercharge-auth = { workspace = true, features = ["middleware"] }
supercharge-config = { workspace = true }
supercharge-config-types = { workspace = true }
supercharge-env = { workspace = true }
supercharge-http = { workspace = true }
supercharge-memory = { workspace = true }
supercharge-sampler = { workspace = true }
supercharge-shell-base = { workspace = true }
supercharge-telemetry = { workspace = true }
supercharge-tools = { workspace = true }
supercharge-version = { workspace = true }
supercharge-system-power = { workspace = true }

# gRPC stack for the gated login path; compiled out unless the feature is on.
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
# Loom model-checking harness; test-only, gated by the `loom` feature.
loom = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }
filetime = { workspace = true }
rcgen = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "time"] }
tokio = { workspace = true, features = ["test-util"] }
supercharge-test-support = { workspace = true }
supercharge-extra-ca = { workspace = true }
# Test-only builds expose `env::EnvVarGuard` to this crate's test targets.
supercharge-shell-base = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
