[package]
name = "e2b-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Rust SDK for E2B cloud sandboxes, vendored and compatibility-patched for this project"

[lib]
name = "e2b_rs"

[dependencies]
thiserror = "2"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
pbjson = "0.9"
pbjson-types = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
regress = "0.10"
tokio = { version = "1", default-features = false, features = ["sync", "time", "rt", "io-util"] }
bytes = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "stream", "rustls", "gzip", "multipart"] }
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip"] }
futures = "0.3"
async-stream = "0.3"
semver = "1"
glob = "0.3"
globset = "0.4"
walkdir = "2"
tempfile = "3"
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
