name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  RUSTFLAGS: -C debuginfo=0

jobs:
  checks:
    name: fmt, clippy, test (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-linux-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ci-linux-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build pager binary for harness tests
        run: |
          cargo build --locked -p supercharge-pager-bin --bin supercharge-pager
          echo "PAGER_BINARY=$PWD/target/debug/supercharge-pager" >> "$GITHUB_ENV"

      - name: Test
        timeout-minutes: 120
        run: cargo test --locked --workspace --no-fail-fast
