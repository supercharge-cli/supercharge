name: Trigger public release build

# Private source stays private. Cross-platform builds run on the PUBLIC
# supercharge-releases repo (unlimited GitHub Actions minutes).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.0.5
        required: true
        default: v1.0.5
        type: string
      source_ref:
        description: Git ref to build from (defaults to the tag)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: trigger-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  trigger-public-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            REF="${{ inputs.source_ref }}"
          else
            TAG="${GITHUB_REF_NAME}"
            REF="${GITHUB_REF_NAME}"
          fi
          if [ -z "$REF" ]; then REF="$TAG"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Dispatch public release workflow
        env:
          GH_TOKEN: ${{ secrets.SUPERCHARGE_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing SUPERCHARGE_RELEASES_TOKEN secret on this private repo." >&2
            echo "Create a PAT with repo scope and add it as SUPERCHARGE_RELEASES_TOKEN." >&2
            exit 1
          fi
          gh api repos/iotserver24/supercharge-releases/dispatches \
            -f event_type=release \
            -f "client_payload[tag]=${{ steps.meta.outputs.tag }}" \
            -f "client_payload[source_ref]=${{ steps.meta.outputs.source_ref }}" \
            -f "client_payload[source_repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[build_daemon]=true"
          echo "Triggered public release build for ${{ steps.meta.outputs.tag }}"
          echo "Watch: https://github.com/iotserver24/supercharge-releases/actions"
