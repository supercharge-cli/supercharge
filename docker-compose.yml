services:
  hermes-agent:
    build:
      context: .
    image: hermes-agent-alternative:local
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./runtime:/app/runtime
    restart: always
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
